apiVersion: v1
kind: Service
metadata:
  name: pelias-data-container
spec:
  ports:
  - port: 9200
    targetPort: 9200
    name: pelias-data-container-service-port-1
    protocol: TCP
  - port: 9300
    targetPort: 9300
    name: pelias-data-container-service-port-2
    protocol: TCP
  selector:
    app: pelias-data-container
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias-data-container
  labels:
    app: pelias-data-container
    update: auto
    checkImageFreshnessAt: "09.00"
    imageFreshnessTitle: "Geocoding_data"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pelias-data-container
  template:
    metadata:
      labels:
        app: pelias-data-container
    spec:
      nodeSelector:
        agentpool: workerpool
      tolerations:
      - key: "workerPod"
        operator: "Equal"
        value: "yes"
        effect: "NoSchedule"
      containers:
      - name: pelias-data-container
        image: hsldevcom/pelias-data-container:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 9200
          name: vip0
        - containerPort: 9300
          name: vip1
        startupProbe:
          # Needs a real query: the index must actually be loaded and
          # queryable before this pod can be trusted, not just "ES is up".
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 40
          httpGet:
            port: 9200
            path: /_search?q=name.fi:helsinki
        readinessProbe:
          # Real query, kept strict: an overloaded pod should be pulled
          # from the Service quickly to shed load without being restarted.
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
          httpGet:
            port: 9200
            path: /_search?q=name.fi:helsinki
        livenessProbe:
          # Decoupled from the query engine on purpose: reusing the same
          # /_search query for liveness meant that under CPU starvation
          # (e.g. GC pauses, node overload) the query itself timed out,
          # so kubelet restarted an otherwise-healthy-but-busy ES process.
          # For a container this heavy to warm up (see startupProbe above),
          # that restart cost made the overload worse, not better. A TCP
          # check only kills pods that are truly wedged/not listening.
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 8
          tcpSocket:
            port: 9200
        env:
        - name: ES_HEAP_SIZE
          value: 2g
        resources:
          requests:
            memory: 3Gi
            cpu: 2000m
          limits:
            memory: 3Gi
            cpu: 4000m
      imagePullSecrets:
        - name: hsldevcomkey