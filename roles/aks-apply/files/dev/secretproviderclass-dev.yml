---
# Only the registry credential is synced centrally: the kubelet needs it before any pod
# starts, so it cannot be produced by the pod that consumes it.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: "keyvault-imagepull"
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "8274e895-09f9-424f-afa1-9ed7c6fc23e6"
    tenantId: "572a41dd-c389-4f0a-b256-aefd1bf149d7"
    keyvaultName: "digitransit-dev-keyvault"
    objects: |
      array:
        - |
          objectName: hsldevcomkey
          objectType: secret
  secretObjects:
    - secretName: "kv-hsldevcomkey"
      type: kubernetes.io/dockerconfigjson
      data:
        - objectName: hsldevcomkey
          key: .dockerconfigjson
