---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: "keyvault-otp-data-builder-varely-v3"
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "8274e895-09f9-424f-afa1-9ed7c6fc23e6"
    tenantId: "572a41dd-c389-4f0a-b256-aefd1bf149d7"
    keyvaultName: "digitransit-dev-keyvault"
    objects: |
      array:
        - |
          objectName: docker-auth
          objectType: secret
        - |
          objectName: docker-user
          objectType: secret
        - |
          objectName: slack-access-token
          objectType: secret
        - |
          objectName: slack-ci-channel-id
          objectType: secret
  secretObjects:
    - secretName: "kv-docker-auth"
      type: Opaque
      data:
        - objectName: docker-auth
          key: docker-auth
    - secretName: "kv-docker-user"
      type: Opaque
      data:
        - objectName: docker-user
          key: docker-user
    - secretName: "kv-slack-access-token"
      type: Opaque
      data:
        - objectName: slack-access-token
          key: slack-access-token
    - secretName: "kv-slack-ci-channel-id"
      type: Opaque
      data:
        - objectName: slack-ci-channel-id
          key: slack-ci-channel-id
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: otp-data-builder-varely-v3
spec:
  schedule: "0 2 * * *" # schedule in Finland time
  timeZone: "Europe/Helsinki"
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 3 # max two retries + initial attempt that might fail due to missing secrets
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
            app: otp-data-builder-varely-v3
        spec:
          activeDeadlineSeconds: 9000 # one build can take max 2 hours and 30 minutes
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: agentpool
                    operator: In
                    values:
                    - builderpool
                    - builderpool2
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                  - key: agentpool
                    operator: In
                    values:
                    - builderpool
          tolerations:
          - key: "builder"
            operator: "Equal"
            value: "yes"
            effect: "NoSchedule"
          serviceAccountName: keyvault-secrets
          containers:
          - name: otp-data-builder-varely-v3
            image: hsldevcom/otp-data-builder:v3
            volumeMounts:
            - name: keyvault
              mountPath: /mnt/keyvault
              readOnly: true
            - mountPath: /opt/otp-data-builder/storage
              name: datastorage
            imagePullPolicy: Always
            securityContext:
              privileged: true
              capabilities:
                add:
                 - NET_ADMIN
                 - SYS_ADMIN
            env:
            - name: BUILDER_TYPE
              value: "VARELY dev v3"
            - name: DOCKER_AUTH
              valueFrom:
                secretKeyRef:
                  name: kv-docker-auth
                  key: docker-auth
            - name: DOCKER_TAG
              value: "v3"
            - name: DOCKER_USER
              valueFrom:
                secretKeyRef:
                  name: kv-docker-user
                  key: docker-user
            - name: SLACK_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kv-slack-access-token
                  key: slack-access-token
            - name: SLACK_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: kv-slack-ci-channel-id
                  key: slack-ci-channel-id
            - name: OTP_TAG
              value: "v2"
            - name: ROUTER_NAME
              value: "varely"
            - name: SEED_TAG
              value: "v3"
            - name: TOOLS_TAG
              value: "v3"
            - name: JAVA_OPTS
              value: "-Xmx24G -Xms24G"
            - name: SKIP_OSM_PREPROCESSING
              value: "true"
            resources:
              requests:
                memory: 26Gi
                cpu: 7000m
              limits:
                memory: 26Gi
                cpu: 8000m
          imagePullSecrets:
            - name: kv-hsldevcomkey
          volumes:
            - name: keyvault
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: keyvault-otp-data-builder-varely-v3
            - name: "datastorage"
              nfs:
                server: digitransitdevaksstrg.file.core.windows.net
                path: /digitransitdevaksstrg/varely
                readOnly: false

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otp-data-builder-varely-v3-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: otp-data-builder-varely-v3
