---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: "keyvault-pelias-data-container-builder"
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "8274e895-09f9-424f-afa1-9ed7c6fc23e6"
    tenantId: "572a41dd-c389-4f0a-b256-aefd1bf149d7"
    keyvaultName: "digitransit-dev-keyvault"
    objects: |
      array:
        - |
          objectName: docker-auth
          objectType: secret
        - |
          objectName: docker-user
          objectType: secret
        - |
          objectName: mmlapikey
          objectType: secret
        - |
          objectName: next-waltti-basic
          objectType: secret
        - |
          objectName: slack-access-token
          objectType: secret
        - |
          objectName: slack-ci-channel-id
          objectType: secret
        - |
          objectName: dev-pelias-data-container-builder-apim-key
          objectType: secret
        - |
          objectName: digitransit-subscription-key-name
          objectType: secret
  secretObjects:
    - secretName: "kv-docker-auth"
      type: Opaque
      data:
        - objectName: docker-auth
          key: docker-auth
    - secretName: "kv-docker-user"
      type: Opaque
      data:
        - objectName: docker-user
          key: docker-user
    - secretName: "kv-mmlapikey"
      type: Opaque
      data:
        - objectName: mmlapikey
          key: mmlapikey
    - secretName: "kv-next-waltti-basic"
      type: Opaque
      data:
        - objectName: next-waltti-basic
          key: next-waltti-basic
    - secretName: "kv-slack-access-token"
      type: Opaque
      data:
        - objectName: slack-access-token
          key: slack-access-token
    - secretName: "kv-slack-ci-channel-id"
      type: Opaque
      data:
        - objectName: slack-ci-channel-id
          key: slack-ci-channel-id
    - secretName: "kv-dev-pelias-data-container-builder-apim-key"
      type: Opaque
      data:
        - objectName: dev-pelias-data-container-builder-apim-key
          key: dev-pelias-data-container-builder-apim-key
    - secretName: "kv-digitransit-subscription-key-name"
      type: Opaque
      data:
        - objectName: digitransit-subscription-key-name
          key: digitransit-subscription-key-name
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pelias-data-container-builder
spec:
  schedule: "0 7 * * *"
  timeZone: "Europe/Helsinki"
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 3 # max two retries + initial attempt that might fail due to missing secrets
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
            app: pelias-data-container-builder
        spec:
          activeDeadlineSeconds: 9000 # one build can take 2 and half hours
          restartPolicy: OnFailure
          nodeSelector:
            agentpool: builderpool
          tolerations:
          - key: "builder"
            operator: "Equal"
            value: "yes"
            effect: "NoSchedule"
          volumes:
            - name: keyvault
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: keyvault-pelias-data-container-builder
          serviceAccountName: keyvault-secrets
          containers:
          - name: pelias-data-container-builder
            volumeMounts:
              - name: keyvault
                mountPath: /mnt/keyvault
                readOnly: true
            image: hsldevcom/pelias-data-container-builder
            imagePullPolicy: Always
            securityContext:
              privileged: true
              capabilities:
                add:
                 - NET_ADMIN
                 - SYS_ADMIN
            env:
            - name: DOCKER_AUTH
              valueFrom:
                secretKeyRef:
                  name: kv-docker-auth
                  key: docker-auth
            - name: API_SUBSCRIPTION_QUERY_PARAMETER_NAME
              valueFrom:
                secretKeyRef:
                  name: "kv-digitransit-subscription-key-name"
                  key: "digitransit-subscription-key-name"
            - name: API_SUBSCRIPTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "kv-dev-pelias-data-container-builder-apim-key"
                  key: "dev-pelias-data-container-builder-apim-key"
            - name: DOCKER_USER
              valueFrom:
                secretKeyRef:
                  name: kv-docker-user
                  key: docker-user
            - name: GTFS_AUTH
              valueFrom:
                secretKeyRef:
                  name: kv-next-waltti-basic
                  key: next-waltti-basic
            - name: BUILDER_TYPE
              value: "dev"
            - name: MMLAPIKEY
              valueFrom:
                secretKeyRef:
                  name: kv-mmlapikey
                  key: mmlapikey
            - name: BUILD_INTERVAL
              value: "-1" # builder shuts down after first build
            - name: THRESHOLD
              value: "5"
            - name: SLACK_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kv-slack-access-token
                  key: slack-access-token
            - name: SLACK_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: kv-slack-ci-channel-id
                  key: slack-ci-channel-id
            - name: EXTRA_SRC
              value: "waltti-alt"
            resources:
              requests:
                memory: 12Gi
                cpu: 7000m
              limits:
                memory: 12Gi
                cpu: 8000m
          imagePullSecrets:
            - name: kv-hsldevcomkey

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pelias-data-container-builder-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pelias-data-container-builder
