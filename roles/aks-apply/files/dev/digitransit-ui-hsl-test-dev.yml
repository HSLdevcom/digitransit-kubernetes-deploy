---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: "keyvault-digitransit-ui-hsl-test"
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "8274e895-09f9-424f-afa1-9ed7c6fc23e6"
    tenantId: "572a41dd-c389-4f0a-b256-aefd1bf149d7"
    keyvaultName: "digitransit-dev-keyvault"
    objects: |
      array:
        - |
          objectName: dev-citybike-scheduler-db-conn-string
          objectType: secret
        - |
          objectName: GTM-ID
          objectAlias: gtm-id
          objectType: secret
        - |
          objectName: hsl-travelers-account-url-dev
          objectType: secret
        - |
          objectName: redis-dev-host
          objectAlias: redis-host
          objectType: secret
        - |
          objectName: redis-dev-primary-key
          objectAlias: redis-key
          objectType: secret
        - |
          objectName: dev-session-secret
          objectAlias: session-secret
          objectType: secret
        - |
          objectName: uat-oidc-client-id
          objectType: secret
        - |
          objectName: uat-oidc-client-secret
          objectType: secret
        - |
          objectName: dev-digitransit-ui-hsl-v3-apim-key
          objectType: secret
        - |
          objectName: digitransit-subscription-key-name
          objectType: secret
  secretObjects:
    - secretName: "kv-dev-citybike-scheduler-db-conn-string"
      type: Opaque
      data:
        - objectName: dev-citybike-scheduler-db-conn-string
          key: dev-citybike-scheduler-db-conn-string
    - secretName: "kv-gtm-id"
      type: Opaque
      data:
        - objectName: gtm-id
          key: gtm-id
    - secretName: "kv-hsl-travelers-account-url-dev"
      type: Opaque
      data:
        - objectName: hsl-travelers-account-url-dev
          key: hsl-travelers-account-url-dev
    - secretName: "kv-redis-host"
      type: Opaque
      data:
        - objectName: redis-host
          key: redis-host
    - secretName: "kv-redis-key"
      type: Opaque
      data:
        - objectName: redis-key
          key: redis-key
    - secretName: "kv-session-secret"
      type: Opaque
      data:
        - objectName: session-secret
          key: session-secret
    - secretName: "kv-uat-oidc-client-id"
      type: Opaque
      data:
        - objectName: uat-oidc-client-id
          key: uat-oidc-client-id
    - secretName: "kv-uat-oidc-client-secret"
      type: Opaque
      data:
        - objectName: uat-oidc-client-secret
          key: uat-oidc-client-secret
    - secretName: "kv-dev-digitransit-ui-hsl-v3-apim-key"
      type: Opaque
      data:
        - objectName: dev-digitransit-ui-hsl-v3-apim-key
          key: dev-digitransit-ui-hsl-v3-apim-key
    - secretName: "kv-digitransit-subscription-key-name"
      type: Opaque
      data:
        - objectName: digitransit-subscription-key-name
          key: digitransit-subscription-key-name
---
apiVersion: v1
kind: Service
metadata:
  name: digitransit-ui-hsl-test
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: digitransit-ui-hsl-test-service-port
  selector:
    app: digitransit-ui-hsl-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digitransit-ui-hsl-test
  labels:
    app: digitransit-ui-hsl-test
    update: auto
    restartAt: "03.40_13.40"
    restartAfterDeployments: "opentripplanner-hsl-v2"
    restartLimitInterval: "180"
spec:
  selector:
    matchLabels:
      app: digitransit-ui-hsl-test
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: digitransit-ui-hsl-test
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - digitransit-ui-hsl-test
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        agentpool: burstpool
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: keyvault-digitransit-ui-hsl-test
      serviceAccountName: keyvault-secrets
      containers:
      - name: digitransit-ui-hsl-test
        volumeMounts:
          - name: keyvault
            mountPath: /mnt/keyvault
            readOnly: true
        image: hsldevcom/digitransit-ui:next
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /etusivu
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /etusivu
            port: 8080
          initialDelaySeconds: 150
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 10
        env:
        - name: TRAFFIC_NOW_TEST
          value: "true"
        - name: CONFIG
          value: "hsl"
        - name: CONTENT_DOMAIN
          value: "https://cms-test.hslfi.hsldev.com"
        - name: RUN_ENV
          value: "development"
        - name: HOSTNAME
          value: "https://next-dev.digitransit.fi"
        - name: API_URL
          value: "https://dev-api.digitransit.fi"
        - name: ASSET_URL
          value: "https://dev-cdn.digitransit.fi/ui/v3/hsl-test"
        - name: MAP_URL
          value: "https://dev-cdn.digitransit.fi"
        - name: NODE_OPTS
          value: "--max_old_space_size=1000"
        - name: RELAY_FETCH_TIMEOUT
          value: "3000"
        - name: API_SUBSCRIPTION_QUERY_PARAMETER_NAME
          valueFrom:
            secretKeyRef:
              name: "kv-digitransit-subscription-key-name"
              key: "digitransit-subscription-key-name"
        - name: API_SUBSCRIPTION_HEADER_NAME
          valueFrom:
            secretKeyRef:
              name: "kv-digitransit-subscription-key-name"
              key: "digitransit-subscription-key-name"
        - name: API_SUBSCRIPTION_TOKEN
          valueFrom:
            secretKeyRef:
              name: "kv-dev-digitransit-ui-hsl-v3-apim-key"
              key: "dev-digitransit-ui-hsl-v3-apim-key"
        - name: GTM_ID
          valueFrom:
            secretKeyRef:
              name: kv-gtm-id
              key: gtm-id
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: kv-redis-host
              key: redis-host
        - name: REDIS_PORT
          value: "6380"
        - name: REDIS_KEY
          valueFrom:
            secretKeyRef:
              name: kv-redis-key
              key: redis-key
        - name: NOINDEX
          value: "1"
        - name: OIDCHOST
          value: "https://hslid-uat.cinfra.fi"
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: kv-session-secret
              key: session-secret
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: kv-uat-oidc-client-id
              key: uat-oidc-client-id
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kv-uat-oidc-client-secret
              key: uat-oidc-client-secret
        - name: CITYBIKE_DB_CONN_STRING
          valueFrom:
            secretKeyRef:
              name: kv-dev-citybike-scheduler-db-conn-string
              key: dev-citybike-scheduler-db-conn-string
        - name: CITYBIKE_DATABASE
          value: "citybike-scheduler-dev"
        - name: STATIC_ASSETS_URL
          value: "https://staticfiles-dev.hslfi.hsldev.com"
        - name: TRAVELERS_ACCOUNT_URL
          valueFrom:
            secretKeyRef:
              name: kv-hsl-travelers-account-url-dev
              key: hsl-travelers-account-url-dev
        resources:
          requests:
            memory: "500Mi"
            cpu: 200m
          limits:
            memory: "1000Mi"
            cpu: 400m
      imagePullSecrets:
        - name: kv-hsldevcomkey
