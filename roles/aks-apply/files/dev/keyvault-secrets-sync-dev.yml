---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keyvault-secrets-sync
  namespace: default
  annotations:
    azure.workload.identity/client-id: "REPLACE_ME_UAMI_CLIENT_ID"
---

# CSI-synced secrets only exist while a pod mounts the volume, so this pod must always run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keyvault-secrets-sync
  namespace: default
  labels:
    app: keyvault-secrets-sync
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: keyvault-secrets-sync
  template:
    metadata:
      labels:
        app: keyvault-secrets-sync
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: keyvault-secrets-sync
      priorityClassName: system-cluster-critical
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - keyvault-secrets-sync
            topologyKey: kubernetes.io/hostname
      nodeSelector:
        agentpool: systempool
      tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      # Public image on purpose: kv-hsldevcomkey does not exist until this pod runs.
      - name: pause
        image: mcr.microsoft.com/oss/kubernetes/pause:3.9
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65535
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 1m
            memory: 8Mi
          limits:
            memory: 32Mi
        volumeMounts:
        - name: keyvault
          mountPath: /mnt/keyvault
          readOnly: true
      volumes:
      - name: keyvault
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: keyvault-dev
---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keyvault-secrets-sync
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keyvault-secrets-sync
