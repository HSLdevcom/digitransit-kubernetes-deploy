apiVersion: v1
kind: Service
metadata:
  name: digitransit-proxy
  #annotations:
   # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    name: digitransit-proxy-service-port-1
  - port: 8080
    targetPort: 8080
    name: digitransit-proxy-service-port-2
  selector:
    app: digitransit-proxy
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: digitransit-proxy
  labels:
    app: digitransit-proxy
    update: auto
spec:
  selector:
    matchLabels:
      app: digitransit-proxy
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 50%
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: digitransit-proxy
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - digitransit-proxy
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        agentpool: burstpool
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: keyvault-digitransit-proxy
      serviceAccountName: keyvault-secrets
      containers:
      - name: digitransit-proxy
        volumeMounts:
          - name: keyvault
            mountPath: /mnt/keyvault
            readOnly: true
        image: hsldevcom/digitransit-proxy:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 2
          httpGet:
            port: 8080
            path: /
        livenessProbe:
          initialDelaySeconds: 150
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 2
          httpGet:
            port: 8080
            path: /
        env:
          - name: NEW_HSL_FI_URL
            value: "test.hslfi.hsldev.com"
          - name: JOJO_BASIC_AUTH
            valueFrom:
              secretKeyRef:
                name: kv-jojo-basic-key
                key: jojo-basic-key
          - name: LINKKI_BASIC_AUTH
            valueFrom:
              secretKeyRef:
                name: kv-linkki-basic-key
                key: linkki-basic-key
          - name: VILKKU_BASIC_AUTH
            valueFrom:
              secretKeyRef:
                name: kv-vilkku-basic-key
                key: vilkku-basic-key
          - name: NEW_LISSU_BASIC_AUTH
            valueFrom:
              secretKeyRef:
                name: kv-new-lissu-basic-key
                key: new-lissu-basic-key
          - name: LAPPEENRANTA_BASIC_AUTH
            valueFrom:
              secretKeyRef:
                name: kv-lappeenranta-basic-key
                key: lappeenranta-basic-key
          - name: LAHTI_BASIC_AUTH
            valueFrom:
              secretKeyRef:
                name: kv-lahti-basic-key
                key: lahti-basic-key
          - name: HAMEENLINNA_BASIC_AUTH
            valueFrom:
              secretKeyRef:
                name: kv-hameenlinna-basic-key
                key: hameenlinna-basic-key
          - name: LMJ_BASIC_AUTH
            valueFrom:
              secretKeyRef:
                name: kv-lmj-basic-key
                key: lmj-basic-key
          - name: MIKKELI_BASIC_AUTH
            valueFrom:
              secretKeyRef:
                name: kv-mikkeli-basic-key
                key: mikkeli-basic-key
          - name: VAASA_BASIC_AUTH
