apiVersion: v1
kind: Service
metadata:
  name: pelias-data-container
spec:
  ports:
  - port: 9200
    targetPort: 9200
    name: pelias-data-container-service-port-1
    protocol: TCP
  - port: 9300
    targetPort: 9300
    name: pelias-data-container-service-port-2
    protocol: TCP
  selector:
    app: pelias-data-container
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias-data-container
  labels:
    app: pelias-data-container
    update: auto
    checkImageFreshnessAt: "10.00"
    imageFreshnessTitle: "Geocoding_data"
spec:
  # replicas: 7
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pelias-data-container
  template:
    metadata:
      labels:
        app: pelias-data-container
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: agentpool
                operator: In
                values:
                - workerpool
                - workerpool2
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: agentpool
                operator: In
                values:
                - workerpool
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - pelias-api
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "workerPod"
        operator: "Equal"
        value: "yes"
        effect: "NoSchedule"
      terminationGracePeriodSeconds: 60
      containers:
      - name: pelias-data-container
        image: hsldevcom/pelias-data-container:prod
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
        lifecycle:
          preStop:
            # Keep serving while the Service endpoint removal propagates, so
            # in-flight and new api requests don't hit a terminating pod.
            exec:
              command: ["sleep", "20"]
        ports:
        - containerPort: 9200
          name: vip0
        - containerPort: 9300
          name: vip1
        startupProbe:
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 40
          httpGet:
            port: 9200
            path: /_search?q=name.fi:helsinki
        readinessProbe:
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
          httpGet:
            port: 9200
            path: /_search?q=name.fi:helsinki
        livenessProbe:
          # Decoupled from the query engine on purpose: reusing the same
          # /_search query for liveness meant that under CPU starvation
          # (e.g. GC pauses, node overload) the query itself timed out,
          # so kubelet restarted an otherwise-healthy-but-busy ES process.
          # For a container this heavy to warm up (see startupProbe above),
          # that restart cost made the overload worse, not better. A TCP
          # check only kills pods that are truly wedged/not listening.
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 8
          tcpSocket:
            port: 9200
        env:
        - name: ES_HEAP_SIZE
          value: 3g
        resources:
          requests:
            memory: 4Gi
            cpu: 2200m
          limits:
            memory: 4Gi
            cpu: 4000m
      imagePullSecrets:
        - name: kv-hsldevcomkey

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pelias-data-container-pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: pelias-data-container
