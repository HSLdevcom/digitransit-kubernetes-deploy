apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-priority-expander
  namespace: kube-system
data:
  priorities: |-
    20:
      - .*-builderpool-.*
      - .*-workerpool-.*
      - .*-turinpool-.*
    10:
      - .*-builderpool2-.*
      - .*-workerpool2-.*
      - .*-turinpool2-.*
    1:
      - .*
