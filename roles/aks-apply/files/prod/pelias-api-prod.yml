apiVersion: v1
kind: Service
metadata:
  name: pelias-api
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: pelias-api-service-port
    protocol: TCP
  selector:
    app: pelias-api
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias-api
  labels:
    app: pelias-api
    update: auto
spec:
  # replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pelias-api
  template:
    metadata:
      labels:
        app: pelias-api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: agentpool
                operator: In
                values:
                - workerpool
                - workerpool2
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: agentpool
                operator: In
                values:
                - workerpool
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - pelias-api
              topologyKey: kubernetes.io/hostname
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - pelias-data-container
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "workerPod"
        operator: "Equal"
        value: "yes"
        effect: "NoSchedule"
      containers:
      - name: pelias-api
        image: hsldevcom/pelias-api:prod
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8080
        readinessProbe:
          # Real geocoding query: an overloaded-but-alive pod should be
          # pulled out of the Service quickly to shed load, without being
          # killed (that's livenessProbe's job below).
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 2
          httpGet:
            port: 8080
            path: /v1/search?text=helsinki
        livenessProbe:
          # Deliberately decoupled from the query engine: a TCP check only
          # confirms the process is alive and listening. Using the same
          # expensive /v1/search query here (as before) meant that under
          # CPU starvation the probe itself timed out, causing kubelet to
          # restart otherwise-healthy-but-busy pods and turning an overload
          # into a crash-loop. Restarts should only happen when the process
          # is truly wedged, not merely slow.
          initialDelaySeconds: 150
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 8
          tcpSocket:
            port: 8080
        resources:
          requests:
            memory: 3Gi
            cpu: "1000m"
          limits:
            memory: 3Gi
            # Was equal to the request (hard CPU cap, Guaranteed QoS). The
            # app itself is single-threaded (Express event loop), but
            # Node's libuv thread pool (fs/dns/crypto/zlib, e.g. gzip'ing
            # responses) and V8's GC run on separate threads concurrently
            # with the main thread. Kubernetes' CFS quota counts total
            # cgroup CPU-time per 100ms period, so a GC pause or thread-pool
            # burst coinciding with the main thread being busy could exceed
            # a 1-core quota and throttle the whole process (including the
            # event loop) even though no single thread needs a full extra
            # core. ~1.5x the request gives slack for that without implying
            # the app can use 2 full cores of parallel JS execution. Verify/
            # tune using container_cpu_cfs_throttled_periods_total.
            cpu: "1500m"
      imagePullSecrets:
        - name: hsldevcomkey

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pelias-api-pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: pelias-api
