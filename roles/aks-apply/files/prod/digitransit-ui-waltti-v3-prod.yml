---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: "keyvault-digitransit-ui-waltti-v3"
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "REPLACE_ME_UAMI_CLIENT_ID"
    tenantId: "REPLACE_ME_TENANT_ID"
    keyvaultName: "digitransit-dev-keyvault"
    objects: |
      array:
        - |
          objectName: prod-citybike-scheduler-db-conn-string
          objectType: secret
        - |
          objectName: GTM-ID
          objectAlias: gtm-id
          objectType: secret
        - |
          objectName: digitransit-ui-waltti-v3-apim-key
          objectType: secret
        - |
          objectName: digitransit-subscription-key-name
          objectType: secret
  secretObjects:
    - secretName: "kv-prod-citybike-scheduler-db-conn-string"
      type: Opaque
      data:
        - objectName: prod-citybike-scheduler-db-conn-string
          key: prod-citybike-scheduler-db-conn-string
    - secretName: "kv-gtm-id"
      type: Opaque
      data:
        - objectName: gtm-id
          key: gtm-id
    - secretName: "kv-digitransit-ui-waltti-v3-apim-key"
      type: Opaque
      data:
        - objectName: digitransit-ui-waltti-v3-apim-key
          key: digitransit-ui-waltti-v3-apim-key
    - secretName: "kv-digitransit-subscription-key-name"
      type: Opaque
      data:
        - objectName: digitransit-subscription-key-name
          key: digitransit-subscription-key-name
---
apiVersion: v1
kind: Service
metadata:
  name: digitransit-ui-waltti-v3
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: digitransit-ui-waltti-v3-service-port
  selector:
    app: digitransit-ui-waltti-v3
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: digitransit-ui-waltti-v3
  labels:
    app: digitransit-ui-waltti-v3
    update: auto
    restartAt: "04.10_12.10_19.00"
    restartLimitInterval: "240"
    restartAfterDeployments: "opentripplanner-waltti-v2"
    restartDelay: "5"
spec:
  selector:
    matchLabels:
      app: digitransit-ui-waltti-v3
  # replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: digitransit-ui-waltti-v3
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - digitransit-ui-waltti-v3
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        agentpool: burstpool
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: keyvault-digitransit-ui-waltti-v3
      serviceAccountName: keyvault-secrets
      containers:
      - name: digitransit-ui-waltti-v3
        volumeMounts:
          - name: keyvault
            mountPath: /mnt/keyvault
            readOnly: true
        image: hsldevcom/digitransit-ui:v3-prod
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 150
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 10
        env:
        - name: API_URL
          value: "https://api.digitransit.fi"
        - name: ASSET_URL
          value: "https://cdn.digitransit.fi/ui/v3/waltti"
        - name: MAP_URL
          value: "https://cdn.digitransit.fi"
        - name: NODE_OPTS
          value: "--max_old_space_size=1500"
        - name: RELAY_FETCH_TIMEOUT
          value: "3000"
        - name: API_SUBSCRIPTION_QUERY_PARAMETER_NAME
          valueFrom:
            secretKeyRef:
              name: "kv-digitransit-subscription-key-name"
              key: "digitransit-subscription-key-name"
        - name: API_SUBSCRIPTION_HEADER_NAME
          valueFrom:
            secretKeyRef:
              name: "kv-digitransit-subscription-key-name"
              key: "digitransit-subscription-key-name"
        - name: API_SUBSCRIPTION_TOKEN
          valueFrom:
            secretKeyRef:
              name: "kv-digitransit-ui-waltti-v3-apim-key"
              key: "digitransit-ui-waltti-v3-apim-key"
        - name: GTM_ID
          valueFrom:
            secretKeyRef:
              name: kv-gtm-id
              key: gtm-id
        - name: BASE_CONFIG
          value: "waltti"
        - name: CITYBIKE_DB_CONN_STRING
          valueFrom:
            secretKeyRef:
              name: kv-prod-citybike-scheduler-db-conn-string
              key: prod-citybike-scheduler-db-conn-string
        - name: CITYBIKE_DATABASE
          value: "citybike-scheduler-prod"
        - name: MAP_VERSION
          value: "v3"
        resources:
          requests:
            memory: 3Gi
            cpu: 800m
          limits:
            memory: 3Gi
            cpu: 1000m
      imagePullSecrets:
        - name: kv-hsldevcomkey

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: digitransit-ui-waltti-v3-pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: digitransit-ui-waltti-v3
