---
# Only the registry credential is synced centrally: the kubelet needs it before any pod
# starts, so it cannot be produced by the pod that consumes it.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: "keyvault-imagepull"
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "REPLACE_ME_UAMI_CLIENT_ID"
    tenantId: "REPLACE_ME_TENANT_ID"
    # Prod intentionally reads from the same key vault as dev.
    keyvaultName: "digitransit-dev-keyvault"
    objects: |
      array:
        - |
          objectName: hsldevcomkey
          objectType: secret
  secretObjects:
    - secretName: "kv-hsldevcomkey"
      type: kubernetes.io/dockerconfigjson
      data:
        - objectName: hsldevcomkey
          key: .dockerconfigjson

---
# The registry credential must exist before any pod starts, so it cannot be produced by the
# pods that consume it. Every other secret is mounted by its own workload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-pull-secret-syncer
  namespace: default
  labels:
    app: image-pull-secret-syncer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: image-pull-secret-syncer
  template:
    metadata:
      labels:
        app: image-pull-secret-syncer
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: keyvault-secrets
      priorityClassName: system-cluster-critical
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - image-pull-secret-syncer
            topologyKey: kubernetes.io/hostname
      nodeSelector:
        agentpool: burstpool
      containers:
      # Public image on purpose: kv-hsldevcomkey does not exist until this pod runs.
      - name: pause
        image: mcr.microsoft.com/oss/kubernetes/pause:3.9
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65535
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 1m
            memory: 8Mi
          limits:
            memory: 32Mi
        volumeMounts:
        - name: keyvault
          mountPath: /mnt/keyvault
          readOnly: true
      volumes:
      - name: keyvault
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: keyvault-imagepull
---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: image-pull-secret-syncer
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: image-pull-secret-syncer
